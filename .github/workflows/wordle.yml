name: Wordle Daily Tracker

on:
  schedule:
    # Runs every day at 06:00 UTC (08:00 Belgrade time)
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  track-wordle:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit scoreboard data back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Wordle bot
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_SUMMARY_CHANNEL_ID: ${{ secrets.DISCORD_SUMMARY_CHANNEL_ID }}
        run: python bot.py

      - name: Commit updated scoreboard
        run: |
          git config user.name "Wordle Bot"
          git config user.email "wordle-bot@users.noreply.github.com"
          git add data/scoreboard.json
          git diff --cached --quiet || git commit -m "Update scoreboard $(date -u +%Y-%m-%d)"
          git push
